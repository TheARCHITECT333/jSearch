; Alembic config for manual CLI use, e.g.
;   alembic revision --autogenerate -m "add job source column"
;   alembic upgrade head
;
; The application does NOT read this file: app/db.py builds an equivalent
; config in-process so migrations run automatically on startup.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./jobhunter.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
