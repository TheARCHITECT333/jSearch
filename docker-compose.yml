services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=INFO
      # `json` for one object per line if you ship these somewhere.
      - LOG_FORMAT=text
      # Embedded SQLite history (swap to Postgres by changing this URL).
      - DATABASE_URL=sqlite:////data/jobhunter.db
      - SEEN_JOB_TTL_DAYS=7
      # Optional, for resume scoring: picked up from .env if set.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - jobhunter-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      # Lets the UI point at an LLM running on your own machine.
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - BACKEND_ORIGIN=http://backend:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  jobhunter-data:
